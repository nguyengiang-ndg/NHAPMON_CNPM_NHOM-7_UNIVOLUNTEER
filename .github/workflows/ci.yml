name: UniVolunteer CI - Unit Tests & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Backend Dependencies & Run Unit Tests (AAA)
        working-directory: ./backend
        run: |
          npm ci || npm install
          npm test
          npm run build

      - name: Install Frontend Dependencies & Build
        working-directory: ./frontend
        run: |
          npm ci || npm install
          npm run build
